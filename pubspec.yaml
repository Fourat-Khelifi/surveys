name: surveys
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  google_fonts: ^8.0.2
  supabase_flutter: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: InterTight
      fonts:
        - asset: fonts/InterTight-VariableFont_wght.ttf
          weight: 400
        - asset: fonts/InterTight-Italic-VariableFont_wght.ttf
          style: italic
  assets:
    - assets/.env
